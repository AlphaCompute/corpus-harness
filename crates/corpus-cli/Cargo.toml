[package]
name = "corpus-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "corpus"
path = "src/main.rs"

[dependencies]
corpus-agent = { path = "../corpus-agent" }
corpus-kernel = { path = "../corpus-kernel" }
corpus-provider = { path = "../corpus-provider" }
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
ratatui = "0.30.2"

[dev-dependencies]
corpus-testkit = { path = "../corpus-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
